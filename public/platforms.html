<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Площадки</title>
	<style>
		:root { color: #161616; background: #fff; font-family: Consolas, "Courier New", monospace; }
		* { box-sizing: border-box; }
		body { max-width: 1180px; margin: 40px auto; padding: 0 20px; font-size: 13px; }
		header { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; margin-bottom: 22px; }
		.title { display: flex; align-items: baseline; gap: 10px; }
		h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.04em; }
		.home-link { background: #161616; color: #fff; padding: 5px 9px; font: inherit; line-height: 1.2; text-decoration: none; }
		.home-link:hover { background: #444; }
		form { display: flex; align-items: center; gap: 8px; color: #666; white-space: nowrap; }
		input { border: 0; border-bottom: 1px solid #bdbdbd; padding: 3px 0; font: inherit; color: inherit; outline: none; }
		input:focus { border-color: #161616; }
		button { border: 0; background: #161616; color: #fff; padding: 5px 9px; font: inherit; cursor: pointer; }
		button:hover { background: #444; }
		.table-wrap { overflow-x: auto; border-top: 1px solid #161616; }
		table { width: 100%; border-collapse: collapse; min-width: 600px; }
		th, td { padding: 7px 10px; border-bottom: 1px solid #e7e7e7; text-align: left; line-height: 1.2; }
		th { color: #666; font-size: 11px; font-weight: 400; text-transform: uppercase; letter-spacing: .04em; }
		#status { min-height: 18px; margin: 10px 0 0; color: #666; }
		@media (max-width: 640px) { body { margin-top: 24px; padding: 0 14px; } header { align-items: flex-start; flex-direction: column; gap: 12px; } }
	</style>
</head>
<body>
	<header>
		<div class="title">
			<a class="home-link" href="/">← Назад</a>
			<h1>Площадки</h1>
		</div>
		<form id="create"><input name="name" placeholder="Название новой площадки" required><button>Добавить площадку</button></form>
	</header>
	<div class="table-wrap">
		<table>
			<thead><tr><th>ID</th><th>Название</th><th>Токен</th><th>Действия</th></tr></thead>
			<tbody id="platforms"></tbody>
		</table>
	</div>
	<p id="status" aria-live="polite"></p>
	<script>
		const body = document.querySelector('#platforms');
		const status = document.querySelector('#status');
		const form = document.querySelector('#create');

		async function load() {
			const response = await fetch('/platforms', {
				headers: { Accept: 'application/json' },
				cache: 'no-store',
			});
			if (!response.ok) return status.textContent = 'Не удалось загрузить площадки';
			const platforms = await response.json();
			body.replaceChildren(...platforms.map(platform => {
				const row = document.createElement('tr');
				for (const value of [platform.id, platform.name, platform.token]) {
					const cell = document.createElement('td');
					cell.textContent = value;
					row.append(cell);
				}
				const cell = document.createElement('td');
				const button = document.createElement('button');
				button.type = 'button';
				button.textContent = 'Обновить токен';
				button.onclick = () => refresh(platform.id);
				cell.append(button);
				const deleteButton = document.createElement('button');
				deleteButton.type = 'button';
				deleteButton.textContent = 'Удалить';
				deleteButton.onclick = () => remove(platform.id, platform.name);
				cell.append(' ', deleteButton);
				row.append(cell);
				return row;
			}));
		}

		async function refresh(id) {
			const response = await fetch('/platforms/' + id + '/token', { method: 'PUT' });
			if (!response.ok) return status.textContent = 'Не удалось обновить токен';
			status.textContent = 'Токен обновлён';
			load();
		}

		async function remove(id, name) {
			if (!confirm(`Удалить площадку «${name}» и все её офферы?`)) return;
			const response = await fetch('/platforms/' + id, { method: 'DELETE' });
			if (!response.ok) return status.textContent = 'Не удалось удалить площадку';
			status.textContent = 'Площадка удалена вместе с её офферами';
			load();
		}

		form.onsubmit = async event => {
			event.preventDefault();
			const response = await fetch('/platforms', {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({ name: form.name.value }),
			});
			if (!response.ok) return status.textContent = 'Не удалось добавить площадку';
			form.reset();
			status.textContent = 'Площадка добавлена';
			load();
		};

		load();
	</script>
</body>
</html>
