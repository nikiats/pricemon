<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Инвентарь</title>
	<style>
		:root { color: #161616; background: #fff; font-family: Consolas, "Courier New", monospace; }
		* { box-sizing: border-box; }
		body { max-width: 1180px; margin: 40px auto; padding: 0 20px; font-size: 13px; }
		header { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; margin-bottom: 22px; }
		.title { display: flex; align-items: baseline; gap: 10px; }
		h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.04em; }
		.home-link { background: #161616; color: #fff; padding: 5px 9px; font: inherit; line-height: 1.2; text-decoration: none; }
		.home-link:hover { background: #444; }
		.table-wrap { overflow-x: auto; border-top: 1px solid #161616; }
		table { width: 100%; border-collapse: collapse; min-width: 800px; }
		th, td { padding: 7px 10px; border-bottom: 1px solid #e7e7e7; text-align: left; line-height: 1.2; vertical-align: top; }
		th { color: #666; font-size: 11px; font-weight: 400; text-transform: uppercase; letter-spacing: .04em; }
		td.item { max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
		.quantity { font-weight: 700; white-space: nowrap; }
		.offer { min-width: 170px; white-space: nowrap; }
		.offer-price { font-weight: 700; }
		.offer-platform { color: #666; }
		.offer a { color: inherit; text-decoration-color: #aaa; text-underline-offset: 2px; }
		.offer a:hover { text-decoration-color: #161616; }
		.empty { color: #999; }
		.status { min-height: 18px; margin: 10px 0 0; color: #666; }
		@media (max-width: 640px) { body { margin-top: 24px; padding: 0 14px; } header { align-items: flex-start; flex-direction: column; gap: 12px; } }
	</style>
</head>
<body>
	<header>
		<div class="title">
			<a class="home-link" href="/">← Назад</a>
			<h1>Инвентарь</h1>
		</div>
	</header>

	<div class="table-wrap">
		<table>
			<thead><tr><th>Предмет</th><th>Категория</th><th>В наличии</th><th>Купить</th><th>Продать</th></tr></thead>
			<tbody id="inventory"></tbody>
		</table>
	</div>
	<p id="status" class="status" aria-live="polite"></p>

	<script>
		const body = document.querySelector('#inventory');
		const status = document.querySelector('#status');
		const dash = '—';
		const price = value => value == null ? dash : new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 2 }).format(Number(value));

		function cell(value, className = '') {
			const element = document.createElement('td');
			element.className = className;
			element.textContent = value;
			return element;
		}

		function offerCell(value, platformName, url) {
			const element = document.createElement('td');
			element.className = 'offer';
			if (value == null || !platformName) {
				element.classList.add('empty');
				element.textContent = dash;
				return element;
			}

			const priceElement = document.createElement('span');
			priceElement.className = 'offer-price';
			priceElement.textContent = price(value);
			element.append(priceElement, ' · ');

			const platform = document.createElement('span');
			platform.className = 'offer-platform';
			platform.textContent = platformName;
			try {
				const offerURL = new URL(url);
				if (!['http:', 'https:'].includes(offerURL.protocol)) throw new Error('unsupported protocol');
				const link = document.createElement('a');
				link.href = offerURL.href;
				link.target = '_blank';
				link.rel = 'noopener noreferrer';
				link.append(platform);
				element.append(link);
			} catch {
				element.append(platform);
			}
			return element;
		}

		async function load() {
			status.textContent = 'Загрузка…';
			try {
				const response = await fetch('/inventory', {
					headers: { Accept: 'application/json' },
					cache: 'no-store',
				});
				if (!response.ok) throw new Error('request failed');
				const items = await response.json();
				body.replaceChildren(...items.map(item => {
					const row = document.createElement('tr');
					row.append(
						cell(item.name, 'item'),
						cell(item.categoryID),
						cell(item.quantity, 'quantity'),
						offerCell(item.sellPrice, item.sellPlatformName, item.sellUrl),
						offerCell(item.buyPrice, item.buyPlatformName, item.buyUrl),
					);
					return row;
				}));
				status.textContent = items.length ? `Позиций в инвентаре: ${items.length}` : 'В инвентаре нет предметов';
			} catch {
				body.replaceChildren();
				status.textContent = 'Не удалось загрузить инвентарь';
			}
		}

		load();
	</script>
</body>
</html>
