<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>GoPriceMon</title>
	<style>
		:root { color: #161616; background: #fff; font-family: Consolas, "Courier New", monospace; }
		* { box-sizing: border-box; }
		body { max-width: 1180px; margin: 40px auto; padding: 0 20px; font-size: 13px; }
		header { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; margin-bottom: 22px; }
		h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.04em; }
		.links { display: grid; grid-template-columns: repeat(2, minmax(0, 260px)); gap: 10px; }
		.links a { display: flex; align-items: center; gap: 10px; min-height: 54px; border: 1px solid #161616; padding: 10px 12px; color: inherit; font-size: 13px; line-height: 1.2; text-decoration: none; }
		.links svg { width: 20px; height: 20px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.6; }
		.links a:hover { background: #161616; color: #fff; }
		@media (max-width: 640px) { body { margin-top: 24px; padding: 0 14px; } .links { grid-template-columns: 1fr; } }
	</style>
</head>
<body>
	<header><h1>gopricemon система</h1></header>
	<nav class="links" aria-label="Страницы сайта">
		<a href="/summary">
			<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h16M7 3v18M14 3v18"/></svg>
			<span>Сводная таблица</span>
		</a>
		<a href="/inventory">
			<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16v13H4zM7 7V4h10v3M8 12h8M8 16h5"/></svg>
			<span>Инвентарь</span>
		</a>
		<a href="/platforms">
			<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M21 12h-3M6 12H3M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1M18.4 18.4l-2.1-2.1M7.7 7.7 5.6 5.6"/></svg>
			<span>Площадки</span>
		</a>
		<a href="/executors">
			<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3"/><path d="M5 21c.5-4 3-6 7-6s6.5 2 7 6M19 5h2M20 4v2"/></svg>
			<span>Исполнители</span>
		</a>
		<a href="/tasks">
			<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h11v16H7zM4 8h3M10 9h5M10 13h5M10 17h4"/></svg>
			<span>Задачи</span>
		</a>
		<a href="/sequential-tasks">
			<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v16H6zM9 8h6M9 12h6M9 16h4"/></svg>
			<span>Последовательные задачи</span>
		</a>
		<a href="/trade-settings">
			<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M21 12h-3M6 12H3M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1M18.4 18.4l-2.1-2.1M7.7 7.7 5.6 5.6"/></svg>
			<span>Настройки трейдов</span>
		</a>
	</nav>
</body>
</html>
