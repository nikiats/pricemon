<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Офферы</title>
	<style>
		body { font: 14px sans-serif; max-width: 1000px; margin: 40px auto; padding: 0 16px; }
		table { border-collapse: collapse; width: 100%; }
		th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
		button { cursor: pointer; }
		#status { min-height: 1.2em; }
	</style>
</head>
<body>
	<h1>Офферы</h1>
	<form id="category-form">
		<label>Категория <input id="category-id" type="number" min="1" value="1" required></label>
		<button>Показать</button>
	</form>
	<p id="status" aria-live="polite"></p>
	<table>
		<thead>
			<tr>
				<th>ID</th>
				<th>Название</th>
				<th>Best Sell</th>
				<th>Платформа</th>
				<th>Кол-во</th>
				<th>Best Buy</th>
				<th>Платформа</th>
				<th>Кол-во</th>
			</tr>
		</thead>
		<tbody id="offers"></tbody>
	</table>
	<p><button id="load-more" type="button">Загрузить ещё</button></p>

	<script>
		const tableBody = document.querySelector('#offers');
		const status = document.querySelector('#status');
		const form = document.querySelector('#category-form');
		const categoryInput = document.querySelector('#category-id');
		const loadMoreButton = document.querySelector('#load-more');
		const pageSize = 20;
		let nextOffset = null;

		function addRows(items) {
			for (const item of items) {
				const row = document.createElement('tr');
				for (const value of [
					item.id,
					item.name,
					item.bestSellPrice ?? '—',
					item.bestSellPlatformName ?? '—',
					item.bestSellCount ?? '—',
					item.bestBuyPrice ?? '—',
					item.bestBuyPlatformName ?? '—',
					item.bestBuyCount ?? '—',
				]) {
					const cell = document.createElement('td');
					cell.textContent = value;
					row.append(cell);
				}
				tableBody.append(row);
			}
		}

		async function loadPage(reset = false) {
			const categoryID = Number(categoryInput.value);
			if (!Number.isInteger(categoryID) || categoryID < 1) return;

			if (reset) {
				tableBody.replaceChildren();
				nextOffset = 0;
			}

			loadMoreButton.disabled = true;
			status.textContent = 'Загрузка…';
			try {
				const params = new URLSearchParams({ limit: pageSize });
				if (nextOffset) params.set('offset', nextOffset);
				const response = await fetch(`/categories/${categoryID}/summary?${params}`);
				if (!response.ok) throw new Error();

				const page = await response.json();
				addRows(page.items);
				nextOffset = page.nextOffset ?? null;
				loadMoreButton.hidden = nextOffset === null;
				status.textContent = page.items.length ? '' : 'Офферы не найдены';
			} catch {
				status.textContent = 'Не удалось загрузить офферы';
				loadMoreButton.hidden = false;
			} finally {
				loadMoreButton.disabled = false;
			}
		}

		form.addEventListener('submit', event => {
			event.preventDefault();
			loadPage(true);
		});
		loadMoreButton.addEventListener('click', () => loadPage());
		loadPage(true);
	</script>
</body>
</html>
