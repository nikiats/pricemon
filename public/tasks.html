<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Задачи</title>
	<style>
		:root { color: #161616; background: #fff; font-family: Consolas, "Courier New", monospace; }
		* { box-sizing: border-box; }
		body { max-width: 1180px; margin: 40px auto; padding: 0 20px; font-size: 13px; }
		header { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; margin-bottom: 22px; }
		.title { display: flex; align-items: baseline; gap: 10px; }
		h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.04em; }
		.home-link { background: #161616; color: #fff; padding: 5px 9px; font: inherit; line-height: 1.2; text-decoration: none; }
		.home-link:hover { background: #444; }
		button { border: 0; background: #161616; color: #fff; padding: 5px 9px; font: inherit; cursor: pointer; }
		button:hover { background: #444; }
		.table-wrap { overflow-x: auto; border-top: 1px solid #161616; }
		table { width: 100%; border-collapse: collapse; min-width: 980px; }
		th, td { padding: 7px 10px; border-bottom: 1px solid #e7e7e7; text-align: left; line-height: 1.2; vertical-align: top; }
		th { color: #666; font-size: 11px; font-weight: 400; text-transform: uppercase; letter-spacing: .04em; }
		.status { min-height: 18px; margin: 10px 0 0; color: #666; }
		.failed { color: #a42626; }
		.completed { color: #19723b; }
		@media (max-width: 640px) { body { margin-top: 24px; padding: 0 14px; } header { align-items: flex-start; flex-direction: column; gap: 12px; } }
	</style>
</head>
<body>
	<header>
		<div class="title">
			<a class="home-link" href="/">← Назад</a>
			<h1>Задачи</h1>
		</div>
	</header>
	<div class="table-wrap">
		<table>
			<thead><tr><th>Предмет</th><th>Площадка</th><th>Исполнитель</th><th>Действие</th><th>Цена</th><th>Статус</th><th>Лизинг до</th><th>Ошибка</th><th></th></tr></thead>
			<tbody id="tasks"></tbody>
		</table>
	</div>
	<p id="status" class="status" aria-live="polite"></p>
	<script>
		const body = document.querySelector('#tasks');
		const status = document.querySelector('#status');
		const text = value => value || '—';
		const action = value => value === 'buy' ? 'Покупка' : value === 'sell' ? 'Продажа' : '—';
		const taskStatus = value => ({ 'not started': 'Не начата', 'in progress': 'В работе', completed: 'Завершена', failed: 'Ошибка' })[value] || '—';
		const price = value => new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 2 }).format(Number(value));
		const dateTime = value => value ? new Intl.DateTimeFormat('ru-RU', { dateStyle: 'short', timeStyle: 'medium' }).format(new Date(value)) : '—';

		function cell(value, className = '') {
			const element = document.createElement('td');
			element.className = className;
			element.textContent = value;
			return element;
		}

		async function errorMessage(response, fallback) {
			try {
				const payload = await response.json();
				return payload.error || fallback;
			} catch {
				return fallback;
			}
		}

		async function load() {
			const response = await fetch('/tasks', { headers: { Accept: 'application/json' }, cache: 'no-store' });
			if (response.status === 204) {
				body.replaceChildren();
				status.textContent = '';
				return;
			}
			if (!response.ok) return status.textContent = 'Не удалось загрузить задачи';
			const tasks = await response.json();
			body.replaceChildren(...tasks.map(task => {
				const row = document.createElement('tr');
				const item = task.itemName ? `${task.itemName}${task.categoryName ? ` (${task.categoryName})` : ''}` : '—';
				const statusClass = task.status === 'failed' ? 'failed' : task.status === 'completed' ? 'completed' : '';
				row.append(
					cell(item),
					cell(text(task.platformName)),
					cell(text(task.executorName)),
					cell(action(task.actionType)),
					cell(price(task.price)),
					cell(taskStatus(task.status), statusClass),
					cell(dateTime(task.leaseUntil)),
					cell(text(task.error), task.status === 'failed' ? 'failed' : ''),
				);
				const actions = document.createElement('td');
				if (task.status === 'in progress') {
					actions.textContent = 'В работе';
				} else {
					const cancelButton = document.createElement('button');
					cancelButton.type = 'button';
					cancelButton.textContent = 'Отменить';
					cancelButton.onclick = () => cancel(task.id);
					actions.append(cancelButton);
				}
				row.append(actions);
				return row;
			}));
		}

		async function cancel(id) {
			if (!confirm('Отменить задачу?')) return;
			const response = await fetch('/tasks/' + id, { method: 'DELETE' });
			if (!response.ok) {
				const message = await errorMessage(response, 'Не удалось отменить задачу');
				status.textContent = message;
				alert(`Задача не отменена: ${message}`);
				return;
			}
			status.textContent = 'Задача отменена';
			load();
		}

		load();
	</script>
</body>
</html>
