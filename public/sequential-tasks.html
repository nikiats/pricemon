<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Последовательные задачи</title>
	<style>
		:root { color: #161616; background: #fff; font-family: Consolas, "Courier New", monospace; }
		* { box-sizing: border-box; }
		body { max-width: 1180px; margin: 40px auto; padding: 0 20px; font-size: 13px; }
		header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 22px; }
		h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.04em; }
		.home-link { background: #161616; color: #fff; padding: 5px 9px; font: inherit; line-height: 1.2; text-decoration: none; }
		.home-link:hover, button:hover { background: #444; }
		.table-wrap { overflow-x: auto; border-top: 1px solid #161616; }
		table { width: 100%; min-width: 850px; border-collapse: collapse; }
		th, td { padding: 7px 10px; border-bottom: 1px solid #e7e7e7; text-align: left; line-height: 1.2; vertical-align: top; }
		th { color: #666; font-size: 11px; font-weight: 400; text-transform: uppercase; letter-spacing: .04em; }
		.trade { white-space: nowrap; }
		.failed { color: #a42626; text-decoration: underline dotted; text-underline-offset: 3px; cursor: help; }
		.completed { color: #19723b; }
		.status { min-height: 18px; margin: 10px 0 0; color: #666; }
		button { border: 0; background: #161616; color: #fff; padding: 5px 9px; font: inherit; cursor: pointer; }
		@media (max-width: 640px) { body { margin-top: 24px; padding: 0 14px; } }
	</style>
</head>
<body>
	<header>
		<a class="home-link" href="/">← Назад</a>
		<h1>Последовательные задачи</h1>
	</header>
	<div class="table-wrap">
		<table>
			<thead><tr><th>ID предмета</th><th>Покупка</th><th>Продажа</th><th>Статус</th><th>Создано</th><th>Завершено</th></tr></thead>
			<tbody id="tasks"></tbody>
		</table>
	</div>
	<p id="status" class="status" aria-live="polite"></p>
	<button id="more" type="button" hidden>Показать ещё</button>
	<script>
		const body = document.querySelector('#tasks');
		const status = document.querySelector('#status');
		const more = document.querySelector('#more');
		const pageSize = 50;
		let nextOffset = 0;
		let loading = false;

		const text = value => value || '—';
		const price = value => new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 2 }).format(Number(value));
		const dateTime = value => value ? new Intl.DateTimeFormat('ru-RU', { dateStyle: 'short', timeStyle: 'medium' }).format(new Date(value)) : '—';
		const taskStatus = value => ({
			'NOT STARTED': 'НЕ НАЧАТА',
			BUYING: 'ПОКУПКА',
			SELLING: 'ПРОДАЖА',
			COMPLETED: 'ЗАВЕРШЕНА',
			FAILED: 'ОШИБКА',
		})[value] || '—';

		function cell(value, className = '') {
			const element = document.createElement('td');
			element.className = className;
			element.textContent = value;
			return element;
		}

		function statusCell(task) {
			const element = document.createElement('td');
			const content = document.createElement('span');
			content.textContent = taskStatus(task.status);
			if (task.status === 'FAILED') {
				content.className = 'failed';
				content.title = task.error || '';
			} else if (task.status === 'COMPLETED') {
				content.className = 'completed';
			}
			element.append(content);
			return element;
		}

		function addRows(tasks) {
			for (const task of tasks) {
				const row = document.createElement('tr');
				row.append(
					cell(task.itemID),
					cell(`${text(task.purchasePlatformName)} (${price(task.purchasePrice)})`, 'trade'),
					cell(`${text(task.salePlatformName)} (${price(task.salePrice)})`, 'trade'),
					statusCell(task),
					cell(dateTime(task.createdAt)),
					cell(dateTime(task.finishedAt)),
				);
				body.append(row);
			}
		}

		async function load() {
			if (loading || nextOffset === null) return;
			loading = true;
			more.hidden = true;
			status.textContent = 'Загрузка…';
			try {
				const response = await fetch(`/sequential-tasks?offset=${nextOffset}&limit=${pageSize}`, { headers: { Accept: 'application/json' }, cache: 'no-store' });
				if (!response.ok) throw new Error('request failed');
				const page = await response.json();
				addRows(page.items);
				nextOffset = page.nextOffset ?? null;
				more.hidden = nextOffset === null;
				status.textContent = body.rows.length ? '' : 'Задачи не найдены';
			} catch {
				status.textContent = 'Не удалось загрузить задачи';
			} finally {
				loading = false;
			}
		}

		more.onclick = load;
		load();
	</script>
</body>
</html>
