version: "2"
sql:
  - engine: postgresql
    schema: internal/web/repository/migrations
    queries: internal/web/repository/queries
    gen:
      go:
        package: db
        out: internal/web/repository/db
        sql_package: pgx/v5
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
