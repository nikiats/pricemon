<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Регистрация — Gopricemon</title>
	<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
	<main class="auth">
		<a class="back-link" href="/">← Назад</a>
		<h1>Регистрация</h1>
		<form class="auth-form">
			<label>Логин <input name="login" autocomplete="username"></label>
			<label>Пароль <input name="password" type="password" autocomplete="new-password"></label>
			<label>Повторите пароль <input name="password-confirmation" type="password" autocomplete="new-password"></label>
			<button type="button">Зарегистрироваться</button>
		</form>
	</main>
</body>
</html>
