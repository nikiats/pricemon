openapi: 3.1.0
info:
  title: Go Price Monitor API
  version: 1.0.0
paths:
  /categories/{categoryID}/items:
    get:
      summary: Get category items
      parameters:
        - $ref: '#/components/parameters/CategoryID'
      responses:
        '200':
          description: Items in the category
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /items/{itemID}/offers:
    put:
      summary: Create or update an offer
      parameters:
        - $ref: '#/components/parameters/ItemID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetOfferRequest'
      responses:
        '204':
          description: Offer saved
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  parameters:
    CategoryID:
      name: categoryID
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ItemID:
      name: itemID
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    Item:
      type: object
      required: [id, name, categoryID]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        categoryID:
          type: integer
          format: int64
    SetOfferRequest:
      type: object
      required: [platformID, side, price]
      properties:
        platformID:
          type: integer
          format: int64
        side:
          type: string
          enum: [S, B]
        price:
          type: string
          description: Decimal number, for example 123.45
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
