openapi: 3.1.0
info:
  title: API мониторинга цен
  version: 1.0.0
paths:
  /categories/{categoryID}/summary:
    get:
      summary: Получить сводку по категории
      parameters:
        - $ref: '#/components/parameters/CategoryID'
        - name: offset
          in: query
          description: Количество уже возвращённых позиций
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          description: Максимальное количество предметов в ответе
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: max_age
          in: query
          description: Максимальный возраст обоих офферов в секундах
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Предметы, для которых найдена подходящая пара офферов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /offers:
    put:
      summary: Создать или обновить оффер
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetOfferRequest'
      responses:
        '204':
          description: Оффер сохранён
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /offers/zero-count:
    put:
      summary: Обнулить количество оффера
      description: Обнуляет количество существующих офферов предмета на указанной платформе. Если предмета нет, он создаётся; новые офферы не создаются.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetZeroCountRequest'
      responses:
        '200':
          description: Количество оффера обновлено либо оффер не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetZeroCountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/platforms:
    get:
      summary: Получить список токенов платформ
      security:
        - adminAuth: []
      responses:
        '200':
          description: Платформы
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Platform'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Создать платформу
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlatformRequest'
      responses:
        '201':
          description: Платформа создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Platform'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/platforms/{platformID}/token:
    put:
      summary: Перевыпустить токен платформы
      security:
        - adminAuth: []
      parameters:
        - $ref: '#/components/parameters/PlatformID'
      responses:
        '200':
          description: Новый токен платформы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    adminAuth:
      type: http
      scheme: basic
  parameters:
    CategoryID:
      name: categoryID
      in: path
      required: true
      schema:
        type: integer
        format: int64
    PlatformID:
      name: platformID
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    ItemSummary:
      type: object
      required: [id, name, categoryID]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        categoryID:
          type: integer
          format: int64
        sellPrice:
          type: [string, 'null']
          description: Минимальная цена продажи предмета
        sellCount:
          type: [integer, 'null']
          description: Количество предметов в оффере продажи
        sellPlatformName:
          type: [string, 'null']
          description: Название площадки продажи
        sellUrl:
          type: [string, 'null']
          description: Ссылка на оффер продажи
        buyPrice:
          type: [string, 'null']
          description: Максимальная цена покупки предмета
        buyCount:
          type: [integer, 'null']
          description: Количество предметов в оффере покупки
        buyPlatformName:
          type: [string, 'null']
          description: Название площадки покупки
        buyUrl:
          type: [string, 'null']
          description: Ссылка на оффер покупки
        actualAt:
          type: [string, 'null']
          format: date-time
          description: Наиболее старое время обновления из двух офферов
    SummaryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemSummary'
        nextOffset:
          type: integer
          format: int64
          description: Смещение для получения следующей страницы
    SetOfferRequest:
      type: object
      required: [categoryID, itemName, platformID, side, price, count]
      properties:
        categoryID:
          type: integer
          format: int64
        itemName:
          type: string
        platformID:
          type: integer
          format: int64
        side:
          type: string
          enum: [S, B]
        price:
          type: string
          description: Десятичное число, например 123.45
        count:
          type: integer
          minimum: 0
        url:
          type: string
    SetZeroCountRequest:
      type: object
      required: [categoryID, itemName, platformID]
      properties:
        categoryID:
          type: integer
          format: int64
        itemName:
          type: string
        platformID:
          type: integer
          format: int64
    SetZeroCountResponse:
      type: object
      required: [result]
      properties:
        result:
          type: string
          enum: [no offer modified, offer count set to zero]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Platform:
      type: object
      required: [id, name, token]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        token:
          type: string
          format: uuid
    Token:
      type: object
      required: [token]
      properties:
        token:
          type: string
          format: uuid
    CreatePlatformRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Некорректный токен платформы
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AdminUnauthorized:
      description: Некорректные учётные данные администратора
