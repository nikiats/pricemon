openapi: 3.1.0
info:
  title: API мониторинга цен
  version: 1.0.0
paths:
  /categories/{categoryID}/summary:
    get:
      summary: Получить сводку по категории
      description: Возвращает страницу предметов с ценами покупки и продажи.
      parameters:
        - $ref: '#/components/parameters/CategoryID'
        - name: offset
          in: query
          description: Количество уже возвращённых позиций
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          description: Максимальное количество предметов в ответе
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: max_age
          in: query
          description: Максимальный возраст обоих офферов в секундах
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Предметы, для которых найдена подходящая пара офферов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /offers:
    put:
      summary: Создать или обновить оффер
      description: Сохраняет актуальные данные одного оффера платформы.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetOfferRequest'
      responses:
        '204':
          description: Оффер сохранён
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /offers/zero-count:
    put:
      summary: Обнулить количество оффера
      description: Обнуляет количество офферов предмета на указанной платформе.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetZeroCountRequest'
      responses:
        '200':
          description: Количество оффера обновлено либо оффер не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetZeroCountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /inventory:
    put:
      summary: Полностью обновить инвентарь
      description: Атомарно заменяет инвентарь переданным полным списком предметов.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceInventoryRequest'
      responses:
        '204':
          description: Инвентарь обновлён
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      summary: Изменить количество предметов
      description: Атомарно применяет переданные изменения количества предметов.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeInventoryRequest'
      responses:
        '204':
          description: Инвентарь изменён
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /tasks:
    get:
      summary: Получить задачи
      description: Возвращает задачи с названиями предметов, площадок и исполнителей.
      responses:
        '200':
          description: Задачи
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskInfo'
        '204':
          description: Задач нет
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Создать задачу
      description: Создаёт не начатую задачу по названиям категории, предмета и площадки.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Задача создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /tasks/{taskID}:
    delete:
      summary: Отменить задачу
      description: Удаляет задачу, если она ещё не взята в работу.
      parameters:
        - $ref: '#/components/parameters/TaskID'
      responses:
        '204':
          description: Задача отменена
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /tasks/from-summary:
    post:
      summary: Создать задачу из сводки
      description: Создаёт не начатую задачу для выбранных предмета, площадки и цены из сводной таблицы.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskFromSummaryRequest'
      responses:
        '201':
          description: Задача создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /tasks/claim:
    post:
      summary: Взять задачу
      description: Выдаёт исполнителю свободную или просроченную задачу указанной платформы.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimTaskRequest'
      responses:
        '200':
          description: Задача с активным лизингом
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimedTask'
        '204':
          description: Подходящих задач нет
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /tasks/{taskID}/lease:
    put:
      summary: Продлить лизинг задачи
      description: Продлевает лизинг задачи на указанное время в пределах лимита конфигурации.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TaskID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtendTaskLeaseRequest'
      responses:
        '200':
          description: Новое время истечения лизинга
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lease'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /tasks/{taskID}/result:
    post:
      summary: Сообщить результат задачи
      description: Завершает активную задачу с результатом completed или failed.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TaskID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportTaskResultRequest'
      responses:
        '204':
          description: Результат сохранён
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /executors:
    get:
      summary: Получить исполнителей
      description: Возвращает всех исполнителей и их токены доступа.
      responses:
        '200':
          description: Исполнители
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Executor'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Создать исполнителя
      description: Создаёт исполнителя и выпускает для него токен доступа.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExecutorRequest'
      responses:
        '201':
          description: Исполнитель создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Executor'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /executors/{executorID}/token:
    put:
      summary: Перевыпустить токен исполнителя
      description: Заменяет токен доступа указанного исполнителя.
      parameters:
        - $ref: '#/components/parameters/ExecutorID'
      responses:
        '200':
          description: Новый токен исполнителя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /executors/{executorID}:
    delete:
      summary: Удалить исполнителя
      description: Удаляет исполнителя.
      parameters:
        - $ref: '#/components/parameters/ExecutorID'
      responses:
        '204':
          description: Исполнитель удалён
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /platforms:
    get:
      summary: Получить платформы
      description: Возвращает все платформы и их токены доступа.
      responses:
        '200':
          description: Платформы
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Platform'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Создать платформу
      description: Создаёт платформу и выпускает для неё токен доступа.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlatformRequest'
      responses:
        '201':
          description: Платформа создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Platform'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /platforms/{platformID}/token:
    put:
      summary: Перевыпустить токен платформы
      description: Заменяет токен доступа указанной платформы.
      parameters:
        - $ref: '#/components/parameters/PlatformID'
      responses:
        '200':
          description: Новый токен платформы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /platforms/{platformID}:
    delete:
      summary: Удалить платформу
      description: Удаляет платформу и все связанные с ней офферы.
      parameters:
        - $ref: '#/components/parameters/PlatformID'
      responses:
        '204':
          description: Платформа удалена
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    CategoryID:
      name: categoryID
      in: path
      required: true
      schema:
        type: integer
        format: int64
    PlatformID:
      name: platformID
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ExecutorID:
      name: executorID
      in: path
      required: true
      schema:
        type: integer
        format: int64
    TaskID:
      name: taskID
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    ItemSummary:
      type: object
      required: [id, name, categoryID]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        categoryID:
          type: integer
          format: int64
        sellPrice:
          type: [string, 'null']
          description: Минимальная цена продажи предмета
        sellCount:
          type: [integer, 'null']
          description: Количество предметов в оффере продажи
        sellPlatformName:
          type: [string, 'null']
          description: Название площадки продажи
        sellUrl:
          type: [string, 'null']
          description: Ссылка на оффер продажи
        buyPrice:
          type: [string, 'null']
          description: Максимальная цена покупки предмета
        buyCount:
          type: [integer, 'null']
          description: Количество предметов в оффере покупки
        buyPlatformName:
          type: [string, 'null']
          description: Название площадки покупки
        buyUrl:
          type: [string, 'null']
          description: Ссылка на оффер покупки
        actualAt:
          type: [string, 'null']
          format: date-time
          description: Наиболее старое время обновления из двух офферов
    SummaryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemSummary'
        nextOffset:
          type: integer
          format: int64
          description: Смещение для получения следующей страницы
    SetOfferRequest:
      type: object
      required: [categoryID, itemName, platformID, side, price, count]
      properties:
        categoryID:
          type: integer
          format: int64
        itemName:
          type: string
        platformID:
          type: integer
          format: int64
        side:
          type: string
          enum: [S, B]
        price:
          type: string
          description: Десятичное число, например 123.45
        count:
          type: integer
          minimum: 0
        url:
          type: string
    SetZeroCountRequest:
      type: object
      required: [categoryID, itemName, platformID]
      properties:
        categoryID:
          type: integer
          format: int64
        itemName:
          type: string
        platformID:
          type: integer
          format: int64
    SetZeroCountResponse:
      type: object
      required: [result]
      properties:
        result:
          type: string
          enum: [no offer modified, offer count set to zero]
    ReplaceInventoryRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Полный актуальный список предметов.
          items:
            $ref: '#/components/schemas/InventoryItem'
    InventoryItem:
      type: object
      required: [categoryID, itemName, quantity]
      properties:
        categoryID:
          type: integer
          format: int64
        itemName:
          type: string
        quantity:
          type: integer
          minimum: 0
    ChangeInventoryRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Изменения количества предметов.
          items:
            $ref: '#/components/schemas/InventoryDelta'
    InventoryDelta:
      type: object
      required: [categoryID, itemName, delta]
      properties:
        categoryID:
          type: integer
          format: int64
        itemName:
          type: string
        delta:
          type: integer
          not: { const: 0 }
    ClaimTaskRequest:
      type: object
      required: [platformID]
      properties:
        platformID:
          type: integer
          format: int64
    ClaimedTask:
      type: object
      required: [id, platformID, actionType, price, leaseToken, leaseUntil]
      properties:
        id:
          type: integer
          format: int64
        platformID:
          type: integer
          format: int64
        actionType:
          type: string
          enum: [buy, sell]
        price:
          type: string
        leaseToken:
          type: string
          format: uuid
        leaseUntil:
          type: string
          format: date-time
    ExtendTaskLeaseRequest:
      type: object
      required: [leaseToken, seconds]
      properties:
        leaseToken:
          type: string
          format: uuid
        seconds:
          type: integer
          minimum: 1
    Lease:
      type: object
      required: [leaseUntil]
      properties:
        leaseUntil:
          type: string
          format: date-time
    ReportTaskResultRequest:
      type: object
      required: [leaseToken, status]
      properties:
        leaseToken:
          type: string
          format: uuid
        status:
          type: string
          enum: [completed, failed]
        error:
          type: string
    CreateTaskRequest:
      type: object
      required: [categoryName, itemName, platformName, actionType, price]
      properties:
        categoryName:
          type: string
        itemName:
          type: string
        platformName:
          type: string
        actionType:
          type: string
          enum: [buy, sell]
        price:
          type: string
    CreateTaskFromSummaryRequest:
      type: object
      required: [categoryID, itemName, platformName, actionType, price]
      properties:
        categoryID:
          type: integer
          format: int64
        itemName:
          type: string
        platformName:
          type: string
        actionType:
          type: string
          enum: [buy, sell]
        price:
          type: string
    TaskInfo:
      type: object
      required: [id, platformName, actionType, price, status]
      properties:
        id:
          type: integer
          format: int64
        itemName:
          type: [string, 'null']
        categoryName:
          type: [string, 'null']
        platformName:
          type: string
        executorName:
          type: [string, 'null']
        actionType:
          type: string
          enum: [buy, sell]
        price:
          type: string
        status:
          type: string
          enum: [not started, in progress, completed, failed]
        error:
          type: [string, 'null']
        leaseUntil:
          type: [string, 'null']
          format: date-time
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Platform:
      type: object
      required: [id, name, token]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        token:
          type: string
          format: uuid
    Executor:
      type: object
      required: [id, name, token]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        token:
          type: string
          format: uuid
    Token:
      type: object
      required: [token]
      properties:
        token:
          type: string
          format: uuid
    CreatePlatformRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
    CreateExecutorRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Изменение невозможно из-за текущего состояния инвентаря
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Некорректный токен доступа
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
